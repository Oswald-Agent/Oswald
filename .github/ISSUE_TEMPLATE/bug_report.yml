name: Bug Report
description: File a bug report to help improve OSWALD
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please describe the problem as clearly as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Traces
      description: Relevant logs, traces, or terminal output.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, dependencies.
      placeholder: |
        - OS: Windows 11
        - Python: 3.12
        - uv: 0.12.x
    validations:
      required: false
